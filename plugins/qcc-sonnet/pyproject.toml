[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qcc-sonnet"
version = "0.1.0"
description = "quantcore-circuits plugin: Sonnet export via KQCircuits"
requires-python = ">=3.11"
dependencies = ["quantcore-circuits", "kqcircuits"]

[project.entry-points."quantcore_circuits.analyses"]
sonnet_s = "qcc_sonnet:SONNET"
