<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="250" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <text x="14" y="22" font-size="15" font-weight="bold" fill="#222">Section order of a v2 design notebook</text>
  <g fill="#222" stroke="#206a5d" stroke-width="1.3">
    <rect x="14" y="40" width="470" height="60" rx="6" fill="#cfe8df"/>
    <rect x="496" y="40" width="490" height="60" rx="6" fill="#ffe3cc" stroke="#d9690f"/>
  </g>
  <text x="26" y="60" font-weight="bold" fill="#222">Design (8 segments)</text>
  <text x="26" y="80" fill="#222">1 die · 2 bond pads · 3 readout line · 4 qubits</text>
  <text x="26" y="94" fill="#222">5 readout resonators · 6 coupling · 7 control lines · 8 whole chip (save)</text>
  <text x="508" y="60" font-weight="bold" fill="#222">Same names as the plugin's Flow strip</text>
  <text x="508" y="80" fill="#222">Check · LOM · Simulate · Results · Fab</text>
  <g fill="#222" stroke="#444" stroke-width="1.2">
    <rect x="14" y="130" width="120" height="70" rx="6" fill="#eef"/>
    <rect x="160" y="130" width="140" height="70" rx="6" fill="#eef"/>
    <rect x="326" y="130" width="190" height="70" rx="6" fill="#eef"/>
    <rect x="542" y="130" width="250" height="70" rx="6" fill="#eef"/>
    <rect x="818" y="130" width="168" height="70" rx="6" fill="#eef"/>
  </g>
  <g fill="#222">
    <text x="24" y="152" font-weight="bold">Check</text><text x="24" y="170">DRC, netlist</text>
    <text x="170" y="152" font-weight="bold">LOM</text><text x="170" y="170">simulation, plots,</text><text x="170" y="184">one hand change</text>
    <text x="336" y="152" font-weight="bold">Simulate</text><text x="336" y="170">export to HFSS, Q3D,</text><text x="336" y="184">eigenmode, driven</text>
    <text x="552" y="152" font-weight="bold">Results</text><text x="552" y="170">eigenmode plots, values, FEM vs LOM,</text><text x="552" y="184">feedback, iterate to target</text>
    <text x="828" y="152" font-weight="bold">Fab</text><text x="828" y="170">export, snapshots,</text><text x="828" y="184">summary</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M134,165 L160,165"/><path d="M300,165 L326,165"/><path d="M516,165 L542,165"/><path d="M792,165 L818,165"/>
    <path d="M250,100 L74,130"/>
  </g>
  <text x="14" y="232" fill="#444">Nothing solves as shipped: RUN_FEM = False. Simulate and Results cells load kept results or print one line.</text>
</svg>
