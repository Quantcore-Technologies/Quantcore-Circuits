name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # Correctness rules only (syntax errors, undefined names, invalid comparisons). The full rule set in
      # pyproject.toml (E, F, W, I, B, UP) is the editor / pre-commit standard and is not a gate yet.
      - run: ruff check --select E9,F63,F7,F82 src tests scripts kplugin docs

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Qt (quantum-metal) and gmsh
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0
          libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - name: Install (CPU torch first, so sqcircuit does not pull the CUDA build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[all,dev]"
      - name: KQCircuits scripts and label font (the PyPI kqcircuits has neither)
        run: qcc kqc-files
      - name: Selftest
        run: qcc selftest
      - name: Tests (no solver, no slow)
        run: python -m pytest -m "not slow and not solver" -q
      - name: Notebook API check (static, nothing is executed)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: bash
        run: python scripts/check_notebook_api.py $(find examples/tutorials -name "*.ipynb" -not -path "*/.ipynb_checkpoints/*" | sort)
