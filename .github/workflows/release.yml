name: Release

# Push a tag vX.Y.Z (equal to project.version in pyproject.toml) to publish to PyPI and create a GitHub release.
# "Run workflow" by hand builds and tests the same files and uploads them to TestPyPI only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the version and compare it with the tag
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project.version $VERSION"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-wheel:
    name: test the built wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: System libraries for Qt and gmsh
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0
          libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - name: Install the wheel (CPU torch first)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(ls dist/*.whl)[all]" pytest
      - name: The installed package, not src/, is what runs
        run: |
          cd "$RUNNER_TEMP"
          python -c "import quantcore_circuits as q; print(q.__file__); assert 'site-packages' in q.__file__"
          qcc kqc-files
          qcc selftest
      - name: Tests against the installed wheel
        # tests/ has an __init__.py, so pytest puts the repo root (not src/) on sys.path: `quantcore_circuits` resolves
        # to the wheel in site-packages.
        run: python -m pytest -m "not slow and not solver" -q -p no:cacheprovider

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quantcore-circuits/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/quantcore-circuits/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  github-release:
    if: github.ref_type == 'tag'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build the KLayout plugin zip
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/release/export_plugin.py --out dist/plugin --zip "dist/quantcore-circuits-klayout-${VERSION}.zip" --check-version "${VERSION}"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(needs.build.outputs.version, 'a') || contains(needs.build.outputs.version, 'b') || contains(needs.build.outputs.version, 'rc') || contains(needs.build.outputs.version, 'dev') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/quantcore-circuits-klayout-*.zip
          generate_release_notes: true
